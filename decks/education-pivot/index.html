<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从政企大客到教育线 · UI 选型</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:#11151c; color:#eef2ff;
    font-family:"PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:40px;
  }
  .wrap{ max-width:980px; width:100%; }
  h1{ font-size:1.6rem; margin:0 0 8px 0; }
  p.sub{ color:#8b96b3; margin:0 0 36px 0; font-size:.95rem; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  a.card{
    display:block; text-decoration:none; color:inherit; border-radius:14px; padding:26px 22px;
    border:1px solid rgba(255,255,255,.12); transition:transform .15s ease, border-color .15s ease;
  }
  a.card:hover{ transform:translateY(-4px); border-color:rgba(255,255,255,.3); }
  .swatch{ width:100%; height:90px; border-radius:8px; margin-bottom:18px; }
  .a .swatch{ background:linear-gradient(135deg,#ffffff,#dce8ff); }
  .b .swatch{ background:linear-gradient(135deg,#0a0e17,#36d1ff,#a78bfa); }
  .c .swatch{ background:linear-gradient(135deg,#f7f2e8,#b45309); }
  .card h2{ font-size:1.1rem; margin:0 0 8px 0; }
  .card p{ font-size:.85rem; color:#8b96b3; margin:0; line-height:1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>从政企大客到教育线 — UI 选型</h1>
    <p class="sub">同一份内容，三种视觉风格。点击进入查看完整 9 页，方向键 / 点击底部圆点翻页。</p>
    <div class="grid">
      <a class="card a" href="option-a-minimal-blue.html">
        <div class="swatch"></div>
        <h2>方案 A · 极简商务蓝</h2>
        <p>白底 + 蓝色强调，简洁专业，适合正式汇报场景。</p>
      </a>
      <a class="card b" href="option-b-dark-tech.html">
        <div class="swatch"></div>
        <h2>方案 B · 暗色科技风</h2>
        <p>深色背景 + 渐变光效，质感强，适合产品 / 技术向汇报。</p>
      </a>
      <a class="card c" href="option-c-warm-editorial.html">
        <div class="swatch"></div>
        <h2>方案 C · 暖系咨询风</h2>
        <p>米色背景 + 衬线标题，类咨询公司印刷质感，沉稳大气。</p>
      </a>
    </div>
  </div>
</body>
</html>
